<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3"><title>个人主页内容管理</title>
  <style>
    :root{--bg:#f5f6f3;--panel:#fff;--ink:#1d211e;--muted:#777e77;--line:#e4e8e2;--green:#345a43;--soft:#edf2ed;--red:#a84135;--shadow:0 16px 50px #26332a0b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(420px,100%);padding:40px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
    .mark{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--soft);color:var(--green);font-family:serif;font-size:20px}.login h1{margin:24px 0 7px;font-size:25px;font-weight:600}.sub{margin:0;color:var(--muted)}
    label{display:block;margin:18px 0 7px;font-size:12px;font-weight:600;color:#515951}.login input,.field input,.field textarea,.project-card input,.project-card textarea{width:100%;border:1px solid var(--line);border-radius:3px;background:#fff;padding:11px 12px;outline:none;color:var(--ink)}input:focus,textarea:focus{border-color:#77927f;box-shadow:0 0 0 3px #345a4312}
    .login input{margin-top:8px}.btn{border:1px solid var(--green);background:var(--green);color:#fff;padding:10px 15px;border-radius:3px;font-size:12px;font-weight:600;transition:.15s}.btn:hover{background:#274733}.btn.secondary{background:#fff;color:var(--green)}.btn.secondary:hover{background:var(--soft)}.btn.ghost{background:transparent;border-color:var(--line);color:#626a62}.btn.ghost:hover{background:#f8f9f7}.btn.danger{border-color:#e4c9c5;color:var(--red);background:#fff}
    .login .btn{width:100%;margin-top:22px}.error{min-height:20px;color:var(--red);font-size:12px;margin-top:12px}
    .topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1120px)/2))}.topbrand{font-weight:650;letter-spacing:.02em}.topbrand span{color:var(--green)}.top-actions{display:flex;gap:9px;align-items:center}.preview{font-size:12px;color:var(--muted);margin-right:10px}
    .layout{width:min(1120px,calc(100% - 40px));margin:38px auto 70px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px;gap:20px}.heading h1{font-size:29px;letter-spacing:-.04em;margin:0 0 5px;font-weight:600}.heading p{margin:0;color:var(--muted)}.saved{color:var(--green);font-size:12px;white-space:nowrap}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:24px}.panel.full{grid-column:1/-1}.panel-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}.panel h2{font-size:16px;margin:0;font-weight:600}.panel-head span{font-size:11px;color:var(--muted)}
    .field{margin-top:17px}.field label{margin:0 0 7px}.field textarea{min-height:90px;resize:vertical;line-height:1.65}.field input,.field textarea{font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hint{color:var(--muted);font-size:11px;margin-top:5px}
    .project-list{display:grid;gap:12px;margin-top:16px}.project-card{border:1px solid var(--line);padding:17px;background:#fcfdfb}.project-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--muted);font-size:11px}.project-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.project-card textarea{grid-column:1/-1;min-height:68px;resize:vertical;font-size:12px}.project-card input{font-size:12px}.actions{display:flex;gap:10px;align-items:center}.statusline{margin-top:17px;font-size:12px;color:var(--muted);min-height:19px}.tip{padding:15px 17px;margin-top:18px;background:var(--soft);color:#4f6554;font-size:12px;line-height:1.7}
    @media(max-width:720px){.topbar{padding:0 16px}.preview{display:none}.layout{width:calc(100% - 28px);margin:25px auto 45px}.grid{grid-template-columns:1fr}.panel.full{grid-column:auto}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:25px}.panel{padding:19px}.two{grid-template-columns:1fr;gap:0}.top-actions .btn{padding:9px 10px}.project-fields{grid-template-columns:1fr}.project-card textarea{grid-column:auto}}
  </style>
</head>
<body>
  <section id="loginView" class="login-wrap hidden">
    <form id="loginForm" class="login">
      <div class="mark">王</div><h1>个人主页后台</h1><p class="sub">登录后编辑网站内容并生成静态页面</p>
      <label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required placeholder="输入服务器配置的管理员密码">
      <button class="btn" type="submit">登录后台</button><div id="loginError" class="error" role="status"></div>
    </form>
  </section>

  <div id="appView" class="hidden">
    <header class="topbar"><div class="topbrand">个人主页<span> / 管理后台</span></div><div class="top-actions"><span class="preview">公开预览：生成后可访问</span><a class="btn secondary" href="/index.html" target="_blank" rel="noreferrer">预览网站</a><button id="logoutBtn" class="btn ghost" type="button">退出</button></div></header>
    <main class="layout">
      <div class="heading"><div><h1>网站内容</h1><p>修改前端展示的信息。保存内容后，再生成静态页面。</p></div><span id="savedState" class="saved">正在加载…</span></div>
      <form id="contentForm">
        <div class="grid">
          <section class="panel">
            <div class="panel-head"><h2>个人介绍</h2><span>首页首屏</span></div>
            <div class="field"><label for="name">姓名</label><input id="name" name="name" required></div>
            <div class="field"><label for="role">身份 / 标题</label><input id="role" name="role"></div>
            <div class="field"><label for="intro">首页介绍</label><textarea id="intro" name="intro"></textarea></div>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>关于我</h2><span>个人经历与信息</span></div>
            <div class="field"><label for="aboutTitle">区块标题</label><input id="aboutTitle" name="aboutTitle"></div>
            <div class="field"><label for="bio1">介绍段落一</label><textarea id="bio1" name="bio1"></textarea></div>
            <div class="field"><label for="bio2">介绍段落二</label><textarea id="bio2" name="bio2"></textarea></div>
            <div class="two"><div class="field"><label for="occupation">目前身份</label><input id="occupation" name="occupation"></div><div class="field"><label for="city">所在城市</label><input id="city" name="city"></div></div>
            <div class="two"><div class="field"><label for="focus">关注领域</label><input id="focus" name="focus"></div><div class="field"><label for="now">最近在做</label><input id="now" name="now"></div></div>
          </section>
          <section class="panel full">
            <div class="panel-head"><h2>项目产品</h2><span>可添加、删除和调整项目文案</span></div>
            <div class="field"><label for="projectTitle">项目区块标题</label><input id="projectTitle" name="projectTitle"></div>
            <div id="projectList" class="project-list"></div>
            <button id="addProject" class="btn ghost" type="button" style="margin-top:14px">＋ 添加项目</button>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>联系方式</h2><span>联系区块</span></div>
            <div class="field"><label for="contactTitle">联系标题</label><input id="contactTitle" name="contactTitle"></div>
            <div class="field"><label for="contactText">联系说明</label><textarea id="contactText" name="contactText"></textarea></div>
            <div class="field"><label for="email">邮箱</label><input id="email" name="email" type="email" required></div>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>社交链接</h2><span>可留空隐藏</span></div>
            <div class="field"><label for="xiaohongshu">小红书网址</label><input id="xiaohongshu" name="xiaohongshu" type="url" placeholder="https://"></div>
            <div class="field"><label for="github">GitHub 网址</label><input id="github" name="github" type="url" placeholder="https://"></div>
          </section>
        </div>
        <div class="tip">保存会将草稿安全写入 GitHub 的 <strong>cms-draft</strong> 分支；点击“静态化”后，主页、关于我、项目产品和联系方式会写入生产分支，并触发 Vercel 自动部署。</div>
        <div class="actions" style="margin-top:20px"><button id="saveBtn" class="btn" type="submit">保存内容</button><button id="publishBtn" class="btn secondary" type="button" disabled>静态化</button><span id="status" class="statusline" role="status"></span></div>
      </form>
    </main>
  </div>
  <script>
    const loginView=document.querySelector('#loginView'),appView=document.querySelector('#appView'),form=document.querySelector('#contentForm'),statusEl=document.querySelector('#status'),savedState=document.querySelector('#savedState'),publishBtn=document.querySelector('#publishBtn');
    let dirty=false;
    async function api(url,options={}){const response=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||'操作失败');return data}
    function markDirty(){dirty=true;savedState.textContent='有未保存的修改';publishBtn.disabled=true;statusEl.textContent='修改尚未保存。'}
    function addProject(project={title:'',type:'',description:''}){const card=document.createElement('div');card.className='project-card';const head=document.createElement('div');head.className='project-head';const label=document.createElement('span');label.textContent=`项目 ${document.querySelectorAll('.project-card').length+1}`;const del=document.createElement('button');del.type='button';del.className='btn danger';del.textContent='删除';del.addEventListener('click',()=>{card.remove();renumber();markDirty()});head.append(label,del);const fields=document.createElement('div');fields.className='project-fields';for(const [key,placeholder] of [['title','项目名称'],['type','项目类型与年份'],['description','项目介绍']]){const el=key==='description'?document.createElement('textarea'):document.createElement('input');el.value=project[key]||'';el.placeholder=placeholder;el.dataset.key=key;el.addEventListener('input',markDirty);fields.append(el)}card.append(head,fields);document.querySelector('#projectList').append(card)}
    function renumber(){document.querySelectorAll('.project-card .project-head span').forEach((el,i)=>el.textContent=`项目 ${i+1}`)}
    function fill(data){for(const [key,value] of Object.entries(data)){if(key==='projects')continue;const el=form.elements.namedItem(key);if(el)el.value=value??''}document.querySelector('#projectList').replaceChildren();(data.projects||[]).forEach(addProject);dirty=false;savedState.textContent='内容已加载';publishBtn.disabled=false}
    async function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');const data=await api('/api/content');fill(data)}
    async function init(){try{const state=await api('/api/session');if(state.authenticated)await showApp();else loginView.classList.remove('hidden')}catch{loginView.classList.remove('hidden')}}
    document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const err=document.querySelector('#loginError');err.textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({password:document.querySelector('#password').value})});await showApp()}catch(error){err.textContent=error.message}});
    form.addEventListener('input',e=>{if(!e.target.closest('.project-card'))markDirty()});
    document.querySelector('#projectList').addEventListener('input',markDirty);
    document.querySelector('#addProject').addEventListener('click',()=>{if(document.querySelectorAll('.project-card').length>=20){statusEl.textContent='最多添加 20 个项目';return}addProject();markDirty()});
    function collectContent(){const data=Object.fromEntries(new FormData(form).entries());data.projects=[...document.querySelectorAll('.project-card')].map(card=>Object.fromEntries([...card.querySelectorAll('[data-key]')].map(el=>[el.dataset.key,el.value])));return data}
    form.addEventListener('submit',async e=>{e.preventDefault();const saveBtn=document.querySelector('#saveBtn');saveBtn.disabled=true;statusEl.textContent='正在保存草稿到 GitHub…';try{await api('/api/content',{method:'PUT',body:JSON.stringify(collectContent())});dirty=false;savedState.textContent='草稿已保存';publishBtn.disabled=false;statusEl.textContent='草稿已安全保存。确认无误后点击“静态化”发布到网站。'}catch(error){statusEl.textContent=error.message}finally{saveBtn.disabled=false}});
    publishBtn.addEventListener('click',async()=>{if(dirty){statusEl.textContent='请先保存修改，再进行静态化。';return}publishBtn.disabled=true;statusEl.textContent='正在静态化并提交生产分支…';try{const result=await api('/api/publish',{method:'POST',body:JSON.stringify(collectContent())});statusEl.textContent=`已提交 ${result.pages.join('、')}。${result.deployment||'网站正在部署。'}`;savedState.textContent='已发布，等待部署完成'}catch(error){statusEl.textContent=error.message}finally{publishBtn.disabled=false}});
    document.querySelector('#logoutBtn').addEventListener('click',async()=>{await api('/api/logout',{method:'POST',body:'{}'});appView.classList.add('hidden');loginView.classList.remove('hidden');document.querySelector('#password').value=''});
    init();
  </script>
</body>
</html>
